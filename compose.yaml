# Default deployment runs Rust + Next.js. No Python services or fallback.
# Preserve the existing host data location. The native backend rejects unsupported
# auth/PocketBase settings instead of bypassing them. Back up data before migration.
services:
  deeptutor:
    image: yanzhizhou-native:local
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    init: true
    environment:
      SPEECH_BASE_URL: ${SPEECH_BASE_URL:-}
      SPEECH_API_KEY: ${SPEECH_API_KEY:-}
      SPEECH_STT_MODEL: ${SPEECH_STT_MODEL:-sensevoice-small-int8}
      SPEECH_TTS_MODEL: ${SPEECH_TTS_MODEL:-kokoro-v1.1-int8}
      SPEECH_VOICE: ${SPEECH_VOICE:-zf_001}
    ports:
      - "127.0.0.1:${HOST_PORT_FRONTEND:-3782}:3782"
    volumes:
      - ${DEEPTUTOR_DATA_DIR:-./data}:/app/data
    restart: unless-stopped
    stop_grace_period: 20s
