name: Desktop Release

# Builds Lorevia for MacOS (Apple Silicon and Intel) and Windows from
# the release tag and attaches downloads to that GitHub Release.
# Each platform's build lives in
# apps/desktop/platforms/<target>/.
#
# Pull requests that touch apps/desktop build all three platforms without
# publishing; they keep the downloads as workflow artifacts for 7 days.
# Pushes to master prepare a new patch version and publish after every target
# succeeds. Pushes to dev and manual validation runs do not publish.
# Pull requests always use disposable runtime signing keys.
#
# Secrets:
#   DESKTOP_RUNTIME_SIGNING_KEY  (required for releases) Ed25519 PEM matching
#                                apps/desktop/assets/runtime-public.pem.
#                                Pull requests always seal with a throwaway key.
#   APPLE_CERTIFICATE_P12, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
#                                (optional) Developer ID signing and
#                                notarization. Without them the Mac apps are
#                                signed ad hoc and Gatekeeper warns on first open.
#   The Windows build is unsigned; SmartScreen warns on first open.

on:
  push:
    branches: [master, dev]
  release:
    types: [published]
  pull_request:
    paths:
      - apps/desktop/**
      - web/**
      - packages/browser-testing/**
      - packages/video-lesson/**
      - rust/**
      - Cargo.toml
      - Cargo.lock
      - VERSION
      - scripts/prepare-desktop-release.mjs
      - scripts/lib/desktop-release.mjs
      - scripts/desktop-release.test.mjs
      - scripts/desktop-github-updates.test.mjs
      - scripts/desktop-logging.test.mjs
      - scripts/lib/release-logging.mjs
      - scripts/update-desktop-readme.mjs
      - scripts/validate-desktop-downloads.mjs
      - .github/workflows/desktop-release.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (required only when publishing)
        required: false
        type: string
      publish:
        description: Attach downloads to the existing release instead of only validating
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      ref: ${{ steps.release.outputs.ref }}
      publish: ${{ steps.release.outputs.publish }}
      skip: ${{ steps.release.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check release automation
        run: node --test scripts/desktop-release.test.mjs scripts/desktop-github-updates.test.mjs scripts/desktop-logging.test.mjs
      - name: Prepare release or validation build
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          PUBLISH: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        run: node scripts/prepare-desktop-release.mjs

  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            name: Lorevia for MacOS with Apple Silicon
            runner: macos-15
          - target: macos-x64
            name: Lorevia for MacOS with Intel Silicon
            runner: macos-15-intel
          - target: windows-x64
            name: Lorevia for Windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      PUBLISH: ${{ needs.prepare.outputs.publish }}
      HAS_DEVELOPER_ID: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
      HAS_RUNTIME_KEY: ${{ github.event_name != 'pull_request' && secrets.DESKTOP_RUNTIME_SIGNING_KEY != '' }}
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Verify release tag matches VERSION
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < ../../VERSION)"
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "Release tag $RELEASE_TAG does not match VERSION ($version)." >&2
            exit 1
          fi

      - name: Verify signing configuration
        if: github.event_name != 'pull_request'
        env:
          HAS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
          HAS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_NOTARY_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD != '' }}
        run: |
          set -euo pipefail
          [ "$HAS_RUNTIME_KEY" = "true" ] || { echo "DESKTOP_RUNTIME_SIGNING_KEY is required for signed validation and releases." >&2; exit 1; }
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ "$HAS_DEVELOPER_ID" = "true" ] || [ "$HAS_SIGNING_IDENTITY" = "true" ] || [ "$HAS_CERTIFICATE_PASSWORD" = "true" ]; then
              [ "$HAS_DEVELOPER_ID" = "true" ] && [ "$HAS_SIGNING_IDENTITY" = "true" ] && [ "$HAS_CERTIFICATE_PASSWORD" = "true" ] || { echo "Developer ID signing configuration is incomplete." >&2; exit 1; }
            fi
            if [ "$HAS_NOTARY" = "true" ] || [ "$HAS_NOTARY_PASSWORD" = "true" ]; then
              [ "$HAS_DEVELOPER_ID" = "true" ] && [ "$HAS_NOTARY" = "true" ] && [ "$HAS_TEAM_ID" = "true" ] && [ "$HAS_NOTARY_PASSWORD" = "true" ] || { echo "Apple notarization configuration is incomplete." >&2; exit 1; }
            fi
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            web/package-lock.json


      - uses: dtolnay/rust-toolchain@1.89.0

      - name: Install the Windows installer toolchain
        if: runner.os == 'Windows'
        run: choco install nsis --yes --no-progress

      - name: Install shell dependencies
        run: npm ci

      - name: Import the Developer ID certificate
        if: runner.os == 'macOS' && env.HAS_DEVELOPER_ID == 'true' && github.event_name != 'pull_request'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          umask 077
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Build the bundled runtime
        env:
          OPEN_DEEPTUTOR_SIGNING_KEY: ${{ github.event_name != 'pull_request' && secrets.DESKTOP_RUNTIME_SIGNING_KEY || '' }}
          APPLE_SIGNING_IDENTITY: ${{ github.event_name != 'pull_request' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_RUNTIME_KEY" = "true" ]; then
            npm run build:runtime -- --target ${{ matrix.target }}
          elif [ "$PUBLISH" = "true" ]; then
            echo "DESKTOP_RUNTIME_SIGNING_KEY is required to publish desktop apps." >&2
            exit 1
          else
            npm run build:runtime -- --target ${{ matrix.target }} --new-key
          fi

      - name: Package
        env:
          APPLE_SIGNING_IDENTITY: ${{ github.event_name != 'pull_request' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        run: npm run package -- --target ${{ matrix.target }}

      - name: Notarize the DMG
        if: runner.os == 'macOS' && env.HAS_NOTARY == 'true' && github.event_name != 'pull_request'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: node scripts/notarize.mjs

      - name: Keep the Apple notarization reports
        if: always() && runner.os == 'macOS' && env.HAS_NOTARY == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: notarization-${{ matrix.target }}
          retention-days: 7
          path: apps/desktop/out/notarization-*.json

      - name: Stage the signed core update
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          cp ".local/${{ matrix.target }}/seed/runtime.json" "out/Lorevia-Core-${{ matrix.target }}.json"
          cp .local/${{ matrix.target }}/seed/*.tar.gz out/

      - name: Keep release downloads
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/desktop/out/*.dmg
            apps/desktop/out/*-Setup.exe
            apps/desktop/out/*-Portable.zip
            apps/desktop/out/Lorevia-Core-*.json
            apps/desktop/out/*.tar.gz

      - name: Remove the temporary signing keychain
        if: always() && runner.os == 'macOS' && env.HAS_DEVELOPER_ID == 'true' && github.event_name != 'pull_request'
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12"
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db"
          fi

      - name: Keep the validation build
        if: always() && env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          retention-days: 7
          path: |
            apps/desktop/out/*.dmg
            apps/desktop/out/*-Setup.exe
            apps/desktop/out/*-Portable.zip

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'master' || github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: downloads
      - name: Verify all signed update packages
        run: node scripts/validate-desktop-downloads.mjs
      - name: Publish the complete release
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for file in \
            "Lorevia-MacOS-Apple-Silicon-v${version}.dmg" \
            "Lorevia-MacOS-Intel-v${version}.dmg" \
            "Lorevia-Windows-v${version}-Setup.exe" \
            "Lorevia-Windows-v${version}-Portable.zip" \
            Lorevia-Core-macos-arm64.json Lorevia-Core-macos-x64.json Lorevia-Core-windows-x64.json; do
            test -s "downloads/$file"
          done
          # Existing releases (including drafts from interrupted runs) can be retried.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "Lorevia $RELEASE_TAG"
          fi
          (cd downloads && sha256sum *.dmg *-Setup.exe *-Portable.zip > SHA256SUMS.txt)
          gh release upload "$RELEASE_TAG" downloads/* --clobber
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true ]; then
            latest="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)"
            make_latest=false
            if [ -z "$latest" ] || [ "$(printf '%s\n' "$latest" "$RELEASE_TAG" | sort -V | tail -1)" = "$RELEASE_TAG" ]; then
              make_latest=true
            fi
            gh release edit "$RELEASE_TAG" --draft=false --latest="$make_latest"
          fi
      - name: Update README after publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          if [ "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" != "$RELEASE_TAG" ]; then
            echo 'A newer release is already published; keeping its README downloads.'
            exit 0
          fi
          node scripts/update-desktop-readme.mjs
          git add README.md
          if ! git diff --cached --quiet; then
            git -c 'user.name=github-actions[bot]' -c 'user.email=41898282+github-actions[bot]@users.noreply.github.com' commit -m "docs: update downloads for $RELEASE_TAG [skip ci]"
            git push origin HEAD:refs/heads/master
          fi

  docker-image:
    needs: [prepare, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
