name: Native application validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "rust/**"
      - "Cargo.*"
      - "VERSION"
      - "packages/video-lesson/**"
      - "scripts/native-video-acceptance.mjs"
      - "scripts/fixtures/video-qa.mp4.b64"
      - "scripts/native-study-acceptance.mjs"
      - "scripts/native-reading-acceptance.mjs"
      - "scripts/native-web-reading-acceptance.mjs"
      - "scripts/native-mastery-acceptance.mjs"
      - "scripts/native-calendar-flashcards-acceptance.mjs"
      - "scripts/desktop-releases.test.mjs"
      - "scripts/desktop-media-permissions.test.mjs"
      - "scripts/desktop-dmg.test.mjs"
      - "apps/desktop/scripts/lib/dmg.mjs"
      - "apps/desktop/scripts/lib/macos.mjs"
      - "apps/desktop/src/media-permissions.mjs"
      - "web/lib/desktop-releases.ts"
      - ".github/workflows/native-validation.yml"

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check desktop download availability and asset validation
        run: node --experimental-strip-types --test scripts/desktop-releases.test.mjs
      - name: Check desktop microphone permission boundaries
        run: node --test scripts/desktop-media-permissions.test.mjs
      - name: Check transactional DMG publication and bounded busy-resource retries
        run: node --test scripts/desktop-dmg.test.mjs
      - name: Check Rust warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test native storage and lifecycle
        run: cargo test --workspace --locked
      - name: Build native HTTP service
        run: cargo build --locked -p deeptutor-server --bin deeptutor-server
      - name: Install pinned video lesson runtime
        run: npm ci --omit=dev --prefix packages/video-lesson
      - name: Exercise lessons and generated clips with synthetic providers
        run: node scripts/native-video-acceptance.mjs
      - name: Exercise isolated study workflows with a synthetic provider
        env:
          OCR_QA: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: node scripts/native-study-acceptance.mjs
      - name: Exercise isolated reading snapshots, annotations and restore
        run: node scripts/native-reading-acceptance.mjs
      - name: Exercise native calendar, task board, flashcards and recovery
        run: node scripts/native-calendar-flashcards-acceptance.mjs
      - name: Exercise frozen reading context and synthetic model discussion
        run: node scripts/native-web-reading-acceptance.mjs
      - name: Exercise mastery prerequisites, fresh evidence and review scheduling
        run: node scripts/native-mastery-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-acceptance-${{ matrix.runner }}
          path: |
            dist/native-study-acceptance/*.json
            dist/native-reading-acceptance/*.json
            dist/native-calendar-flashcards-acceptance/*.json
            dist/native-web-reading-acceptance/*.json
            dist/native-mastery-acceptance/*.json
          if-no-files-found: ignore
