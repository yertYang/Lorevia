name: Docker Release

# Triggered when a GitHub Release is published.
# Builds a multi-platform Docker image and pushes it to GitHub Container Registry (GHCR).
#
# Image: ghcr.io/<current owner>/<current repository>
# Tags:
#   - Version tag stripped of 'v' prefix (e.g. release v1.2.3 → image tag 1.2.3)
#   - latest (always points to the most recently published release)
#
# Platforms: linux/amd64, linux/arm64

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      prerelease:
        default: false
        type: boolean
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  validate-release-tag:
    name: Validate release tag
    if: startsWith(inputs.tag || github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.validate.outputs.image_tag }}
      is_stable: ${{ steps.validate.outputs.is_stable }}
      is_latest: ${{ steps.latest.outputs.is_latest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require an image version tag
        id: validate
        run: node scripts/validate-release-tag.mjs
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      - name: Keep older retries from replacing the latest image
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          latest="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)"
          if [ "$latest" = "$RELEASE_TAG" ]; then
            echo 'is_latest=true' >> "$GITHUB_OUTPUT"
          else
            echo 'is_latest=false' >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: Build and Push Multi-Platform Docker Image
    needs: validate-release-tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      # Required for linux/arm64 cross-compilation on GitHub-hosted ubuntu runners
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Enable BuildKit with multi-platform build support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The validated version drops the leading 'v'. Pre-releases retain a
      # versioned image but never replace the stable 'latest' tag.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.validate-release-tag.outputs.image_tag }}
            type=raw,value=latest,enable=${{ !inputs.prerelease && github.event.release.prerelease != true && needs.validate-release-tag.outputs.is_stable == 'true' && needs.validate-release-tag.outputs.is_latest == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Use GitHub Actions cache to speed up repeated builds
          # Cache the Rust and frontend build stages as well as the final image.
          cache-from: type=gha
          cache-to: type=gha,mode=max
